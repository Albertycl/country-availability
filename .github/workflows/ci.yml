name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/albertycl/country-availability

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend import check
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          DATABASE_URL=mysql+pymysql://x:y@127.0.0.1:3306/z python -c "import main_testing_jenny_excel"
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Frontend build check
        working-directory: quasar_frontend
        run: |
          npm install -g @quasar/cli
          npm ci --legacy-peer-deps --no-audit --no-fund
          quasar build

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: backend,  context: backend }
          - { name: frontend, context: quasar_frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out gitops-apps
        uses: actions/checkout@v4
        with:
          repository: Albertycl/gitops-apps
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops
      - name: Set new image tags
        working-directory: gitops/manifests/country-availability
        run: |
          for n in backend frontend; do
            kustomize edit set image \
              ghcr.io/albertycl/country-availability-$n=ghcr.io/albertycl/country-availability-$n:${{ github.sha }}
          done
      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "country-availability: deploy ${GITHUB_SHA::7}"
          git push
